<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>     
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>   
    <link rel="stylesheet" href="./static/cesium/Widgets/widgets.css" type="text/css">
    <link rel="stylesheet" href="./static/cxe/cxe.css" type="text/css">
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=1.4.15&key=2dd5476719ea3378dc06ef93b3d4aba7"></script>
    <script src="./static/cesium/Cesium.js" type="text/javascript"></script>
    <script src="./static/cxe/cxe.js" type="text/javascript"></script>    
    <link rel="stylesheet" href="./static/adapt-pc/pc.css" type="text/css">   
    <title></title>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <script type="text/html" id="tpl-adapt-pc">
      <div class="container"><iframe src="helang-mobile-href"></iframe></div>
    </script>
    <uni-adapt-pc></uni-adapt-pc>
    <div id="app">
      <style>
        .loading-wrap {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          width: 100%;
          height: 90vh;
        }
        .dot {
          display: flex;
          flex-wrap: wrap;
          width: 36px;
          height: 36px;
          transform: rotate(45deg);
          animation: ant-rotate 1.2s infinite linear;
        }
        .dot i {
          margin: 2px;
          border-radius: 50%;
          width: 14px;
          height: 14px;
          background-color: #1890ff;
          opacity: 0.3;
          animation: ant-spin-move 1s infinite linear alternate;
        }
        .dot i:nth-child(2) {
          animation-delay: 0.4s;
        }
        .dot i:nth-child(3) {
          animation-delay: 0.8s;
        }
        .dot i:nth-child(4) {
          animation-delay: 1.2s;
        }
        @keyframes ant-rotate {
          to {
            transform: rotate(405deg);
          }
        }
        @keyframes ant-spin-move {
          to {
            opacity: 1;
          }
        }
      </style>
      <div class="loading-wrap">
        <div class="dot"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script src="./static/adapt-pc/pc.js" type="text/javascript"></script>
  </body>
</html>
